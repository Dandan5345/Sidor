name: Weekly schedule automation
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: sidor-weekly-automation
  cancel-in-progress: false
jobs:
  automate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Authenticate with a short-lived Google identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/862141234850/locations/global/workloadIdentityPools/sidor-github/providers/sidor-weekly
          service_account: sidor-weekly-automation@sidoravoda111.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: false
      - name: Apply due weekly events atomically
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_DATABASE_URL: https://sidoravoda111-default-rtdb.europe-west1.firebasedatabase.app
        run: node scripts/server-automation.cjs
